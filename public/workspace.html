<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luna // Workspace</title><style>body{margin:0;background:#070b16;color:#e8efff;font:16px monospace;padding:6vw}button{padding:14px 18px;background:#62e6ff;border:0;border-radius:8px;font:inherit}video{display:block;width:100%;max-height:60vh;margin-top:20px;background:#000}#status{color:#62e6ff;margin-top:20px}nav{margin-bottom:30px}a{color:#62e6ff;margin-right:20px}</style></head><body><nav><a href="/index.html">HOME</a><a href="/export.html">EXPORT</a></nav><h1>WORKSPACE</h1><p>Import raw footage untuk preview lokal.</p><input id="file" type="file" accept="video/*"><button id="analyze">RUN ANALYSIS</button><p id="status">Belum ada footage.</p><video id="preview" controls hidden></video><script>const file=document.querySelector('#file'),video=document.querySelector('#preview'),status=document.querySelector('#status');file.onchange=()=>{const f=file.files[0];if(!f)return;video.src=URL.createObjectURL(f);video.hidden=false;status.textContent='FOOTAGE READY // '+f.name};document.querySelector('#analyze').onclick=()=>status.textContent=file.files[0]?'ANALYSIS READY // gunakan app utama untuk AI timeline':'IMPORT FOOTAGE DULU';</script></body></html>
