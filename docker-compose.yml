services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: luna
      POSTGRES_USER: luna
      POSTGRES_PASSWORD: luna_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://luna:luna_dev_password@db:5432/luna
      REDIS_URL: redis://redis:6379
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-luna-media}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./apps/api:/app
      - uploads:/app/uploads
      - ./assets:/app/assets
    depends_on:
      - db
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  uploads:
